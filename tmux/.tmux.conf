unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g mouse on

bind-key v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# make the switch window start collapsed by default
bind-key 'w' choose-tree -Zs

setw -g mode-keys vi

# Fix delayed tmux escape key in nvim
set -sg escape-time 0

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Windows start at 1 so prefix+1, prefix+2 match the status bar.
# Keep panes 0-based — tmuxifier layouts in ~/.tmux-layouts use pane index 0.
set -g base-index 1

# True colour for Ghostty, lazygit, neovim, etc. (screen-256color breaks lazygit).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmuxifier'

set -g status-position top

# Catppuccin setup (v2 options — see catppuccin/tmux docs)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"
# Window name (e.g. "editor"); use #T instead if you prefer the active program name.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Inactive tabs: use distinct, readable colours (defaults are very dark on mocha).
set -g @catppuccin_window_number_color "#{@thm_mauve}"
set -g @catppuccin_window_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_2}"

# Initialise TMUX plugin manager. Keep below plugin setup.
run '~/.tmux/plugins/tpm/tpm'

# Status modules must be set after catppuccin loads (via TPM above).
set -g status-left ""
set -g status-left-length 0
set -g status-right ""
set -g status-right-length 0


